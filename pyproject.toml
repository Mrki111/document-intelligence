[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "document-intelligence"
version = "0.1.0"
description = "Serverless AWS document processing pipeline using Lambda, S3, DynamoDB, Textract, and optional Bedrock analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.13",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["lambdas", "shared"]
